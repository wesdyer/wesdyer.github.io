<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCYC Regatta — Competitor Roster</title>
    <link rel="icon" type="image/png" href="assets/images/misc/salty-crew-yacht-club-burgee.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400..900;1,400..900&family=IBM+Plex+Mono:wght@400;600&family=Saira:ital,wdth,wght@0,50..125,100..900;1,50..125,100..900&display=swap" rel="stylesheet">
    <style>
        /* Same typography system as index.html — the roster has to look like
           the game, or it is not a review of the game. */
        body { font-family: 'Archivo', ui-sans-serif, system-ui, sans-serif; background-color: #0b1220; color: #e6ecf8; }
        .t-display { font-family: 'Saira', 'Archivo', sans-serif; font-stretch: 81%; font-weight: 900; }
        .t-label { font-family: 'Archivo', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 11px; letter-spacing: 2px; color: #7f8ea9; }
        .t-label-sm { font-size: 10.5px; letter-spacing: 1.6px; }
        .t-mono { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-variant-numeric: tabular-nums; }
        canvas { display: block; }

        /* One column per ~480px: the profile band needs that much before the
           name and the boat start fighting for the same space. */
        #roster {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
            gap: 22px;
        }
        @media (max-width: 560px) {
            #roster { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="min-h-screen">

<!-- The engine is loaded only for its data and its sprite pipeline. It needs
     this canvas to exist at parse time; it is never drawn to. -->
<canvas id="gameCanvas" width="1" height="1" style="display:none"></canvas>

<div class="max-w-[1800px] mx-auto px-8 py-10">
    <div class="flex items-baseline gap-4 flex-wrap mb-1">
        <h1 class="t-display italic uppercase text-white" style="font-size:38px;">Competitor Roster</h1>
        <span id="roster-count" class="t-mono text-slate-400" style="font-size:15px;"></span>
    </div>
    <div class="t-label mb-8">Review sheet &middot; alphabetical &middot; not linked from the game</div>

    <div id="roster"></div>
    <div id="roster-error" class="hidden t-mono text-rose-300 mt-6" style="font-size:14px;"></div>
</div>

<script>
    // Keep the game dormant. script.js kicks off its animation loop at the end
    // of the file; on a review sheet that would burn a core forever, so swallow
    // the first frame request and hand the real one back afterwards. (The eval
    // harness stubs rAF the same way.)
    window.__realRAF = window.requestAnimationFrame.bind(window);
    window.requestAnimationFrame = () => 0;
</script>
<script src="js/ai-quotes.js"></script>
<script src="js/water.js"></script>
<script src="js/planner.js"></script>
<script src="js/rules.js"></script>
<script src="js/arena.js"></script>
<!-- script.js reads VenueDoc.U_PER_M at TOP LEVEL. Without this the file throws partway
     through, every `const` below that point stays uninitialised, and the roster drew bands
     with no boats on them — the functions are hoisted, so it failed quietly. -->
<script src="js/venuedoc.js"></script>
<script src="js/game/core.js"></script>
<script src="js/game/state.js"></script>
<script src="js/game/audio.js"></script>
<script src="js/sim/wind.js"></script>
<script src="js/sim/water.js"></script>
<script src="js/sim/ice.js"></script>
<script src="js/sim/physics.js"></script>
<script src="js/sim/collision.js"></script>
<script src="js/sim/course.js"></script>
<script src="js/game/telemetry.js"></script>
<script src="js/ai/roster.js"></script>
<script src="js/ai/bot.js"></script>
<script src="js/ai/navigation.js"></script>
<script src="js/ai/avoidance.js"></script>
<script src="js/script.js"></script>
<script>
    window.requestAnimationFrame = window.__realRAF;

    const STAT_ORDER = ['acceleration', 'momentum', 'handling', 'upwind', 'reach', 'downwind', 'pressure', 'lightAir', 'heavyAir', 'memory'];
    const STAT_ABBR = {
        acceleration: 'ACC', momentum: 'MOM', handling: 'HDL',
        upwind: 'UPW', reach: 'RCH', downwind: 'DWN', pressure: 'PRS', lightAir: 'LGT', heavyAir: 'HVY', memory: 'MEM'
    };

    // A reviewer wants the whole stat line, not just the three the in-game
    // panel highlights — plus the paint job, which the profile only implies.
    function reviewStrip(cfg) {
        const stats = STAT_ORDER.map(k => {
            const v = cfg.stats[k] ?? 0;
            const tone = v > 0 ? 'color:#6ee7b7' : v < 0 ? 'color:#fda4af' : 'color:#64748b';
            return `<div class="text-center">
                        <div class="t-label t-label-sm" style="letter-spacing:1px;">${STAT_ABBR[k]}</div>
                        <div class="t-mono" style="font-size:15px; ${tone}">${v > 0 ? '+' : ''}${v}</div>
                    </div>`;
        }).join('');
        const swatch = (label, color) => color
            ? `<span class="inline-flex items-center gap-1.5">
                   <span style="width:11px;height:11px;border-radius:3px;background:${color};box-shadow:inset 0 0 0 1px rgba(255,255,255,0.25)"></span>
                   <span class="t-mono" style="font-size:11.5px;color:#8ea0bd">${label} ${color}</span>
               </span>`
            : '';
        const kite = (typeof SPIN_LOOKS !== 'undefined' && SPIN_LOOKS[cfg.name]) || 'solid';
        return `
            <div class="mt-5 pt-4" style="border-top:1px solid rgba(255,255,255,0.08)">
                <div class="grid grid-cols-10 gap-1 mb-3">${stats}</div>
                <div class="flex flex-wrap gap-x-4 gap-y-1.5 items-center">
                    ${swatch('hull', cfg.hull)}
                    ${swatch('sail', cfg.sail)}
                    ${swatch('kite', cfg.spinnaker)}
                    ${swatch('kite2', cfg.spinnaker2)}
                    ${swatch('kite3', cfg.spinnaker3)}
                    <span class="t-mono" style="font-size:11.5px;color:#8ea0bd">pattern ${kite}${typeof spinColorCount === 'function' ? ' (' + spinColorCount(kite) + ')' : ''}</span>
                    <span class="t-mono" style="font-size:11.5px;color:#8ea0bd">archetype ${cfg.archetype || '—'}</span>
                </div>
            </div>`;
    }

    function buildRoster() {
        const root = document.getElementById('roster');
        const fleet = [...AI_CONFIG].sort((a, b) => a.name.localeCompare(b.name));
        document.getElementById('roster-count').textContent = fleet.length + ' competitors';

        root.innerHTML = fleet.map(cfg => `
            <section class="bg-slate-800/50 rounded-2xl p-6 border border-white/10 shadow-xl">
                ${competitorProfileHTML(cfg)}
                ${reviewStrip(cfg)}
            </section>`).join('');

        // Same sprite pipeline the game uses, one canvas per profile
        const byName = new Map(fleet.map(c => [c.name, c]));
        root.querySelectorAll('.profile-boat-canvas').forEach(c => {
            renderProfileBoat(c, byName.get(c.dataset.boat));
        });
    }

    try {
        buildRoster();
    } catch (err) {
        const box = document.getElementById('roster-error');
        box.textContent = 'Roster failed to build: ' + err.message;
        box.classList.remove('hidden');
        throw err;
    }
</script>
</body>
</html>
